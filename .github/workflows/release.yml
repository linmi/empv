# Builds the artefacts a release consists of and attaches them to a GitHub
# Release. empv is not on npm: these tarballs are the distribution, and the
# install instructions in the release body name both of them explicitly because
# an optionalDependency can only be resolved from a registry.
#
# What each platform contributes, and why they are not symmetrical:
#
#   darwin-arm64, darwin-x64  the addon plus a libmpv runtime built here from
#                             pinned sources with -Dgpl=false. macOS has no
#                             system libmpv, so the package has to carry one,
#                             and it has to be the LGPL build.
#   win32-x64                 the addon plus a libmpv cross-compiled here with
#                             MinGW-w64, statically linked into one DLL. Every
#                             prebuilt Windows libmpv is GPL, so the only way to
#                             bundle one at all is to build it.
#   (no linux)                it would be addon-only, but the resolver looks for
#                             the library inside the runtime directory and on
#                             Linux it lives in /usr/lib. Until that discovery
#                             exists, a linux package would install and then
#                             fail to resolve.
#
# The two macOS builds run on separate runners on purpose: build-macos-runtime
# configures every package for the host and does not cross-compile, and it now
# refuses an arch that is not the host's rather than mislabel the output.
#
# WHAT STARTS A RELEASE
#
# The version in package.json, and nothing else. A push to main whose version
# has no release yet builds one; every other push does nothing. The tag is an
# output rather than an input -- `gh release create` creates it at the released
# commit -- which is what lets a single field decide, and also sidesteps the
# rule that a tag pushed with GITHUB_TOKEN cannot trigger a workflow.
#
# So a version bump on main publishes. That is the point of it, but it does mean
# the bump is the irreversible step, not the tag push that used to follow it.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify everything without creating a release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Whether there is anything to do. Runs on every push to main, so it has to be
  # cheap: no checkout of history, no toolchain, one API call.
  # ───────────────────────────────────────────────────────────────────────────
  decide:
    name: decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Asking whether the release exists, rather than diffing package.json
      # against the previous commit, is what makes this safe to re-run: a push
      # that failed halfway leaves no release, so the next push retries, and a
      # push that changed nothing else still cannot double-publish.
      - name: Decide whether this version needs releasing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${version} is already released; nothing to do."
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${version} is unreleased, but ${GITHUB_EVENT_NAME} never publishes."
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "v${version} has no release: building one."

  # ───────────────────────────────────────────────────────────────────────────
  # The platform-independent package: types, JS, and the source the addon is
  # built from. No native toolchain involved, so it does not need to share a
  # runner with anything that has one.
  # ───────────────────────────────────────────────────────────────────────────
  main-package:
    name: main package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: decide
    # Builds when there is a release to build, and on a manual run so the whole
    # path can be exercised without publishing. Nothing else compiles anything.
    if: needs.decide.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run the TypeScript tests and type check
        run: |
          pnpm run typecheck
          pnpm run test:node

      # `npm pack` runs prepack, which builds dist/.
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tarballs"
          npm pack --pack-destination "${RUNNER_TEMP}/tarballs"
          ls -l "${RUNNER_TEMP}/tarballs"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tarball-main
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # macOS: build the LGPL runtime from pinned sources, link the addon against
  # it, then prove the resulting tarball works by installing it into an empty
  # project outside the checkout and opening a real mpv session there.
  # ───────────────────────────────────────────────────────────────────────────
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    needs: decide
    # Builds when there is a release to build, and on a manual run so the whole
    # path can be exercised without publishing. Nothing else compiles anything.
    if: needs.decide.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          # GitHub retired the macos-13 image, which was the last Intel runner
          # under a plain version label; macos-15-intel is its replacement. A
          # retired label does not fail the job -- it queues for a runner that
          # will never come -- so a stuck x64 job means checking this first.
          - arch: x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          key: release-${{ matrix.arch }}

      # curl, tar, make, git and patch are on the image already; these are not.
      - name: Install the runtime build tools
        run: brew install meson ninja nasm pkg-config

      - name: Setup pnpm (from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Seven packages from source takes the better part of an hour. The output
      # is a pure function of the pinned versions, the patches and the meson and
      # configure flags, so the key covers exactly those: change any of them and
      # the cache misses and it rebuilds.
      - name: Cache the built LGPL runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: runtime-prefix
          key: >-
            empv-lgpl-runtime-${{ matrix.arch }}-${{ hashFiles(
              'scripts/embedded-mpv/runtime-pins.mjs',
              'scripts/embedded-mpv/build-macos-runtime.mjs',
              'scripts/embedded-mpv/patches/**'
            ) }}

      - name: Build the LGPL libmpv runtime from pinned sources
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: pnpm run build-runtime:macos -- ${{ matrix.arch }} "${GITHUB_WORKSPACE}/runtime-prefix"

      - name: Stage the runtime into the package
        run: pnpm run stage-runtime:macos -- ${{ matrix.arch }} "${GITHUB_WORKSPACE}/runtime-prefix"

      # EMPV_REQUIRE stops the build from degrading to "embedded mpv
      # unavailable" and writing a marker file, which is the right behaviour for
      # a contributor without a staged runtime and the wrong one for a release.
      - name: Build the addon against the staged runtime
        env:
          EMPV_REQUIRE: '1'
        run: pnpm run build:native

      - name: Assert the addon carries the release runtime
        run: |
          set -euo pipefail
          manifest=dist/native/runtime-manifest.json
          origin="$(node -p "require('./${manifest}').origin")"
          arch="$(node -p "require('./${manifest}').arch")"
          if [ "$origin" != "vendored-lgpl" ]; then
            echo "Refusing to release a \"${origin}\" runtime."
            exit 1
          fi
          if [ "$arch" != "${{ matrix.arch }}" ]; then
            echo "Staged runtime is ${arch}, this job builds ${{ matrix.arch }}."
            exit 1
          fi
          # The label says arm64/x64; ask the binary itself.
          file dist/native/empv.node
          lipo -archs dist/native/empv.node
          echo "origin=${origin} arch=${arch}"

      # Packs the platform package, installs it and the main package into an
      # empty project outside this checkout, and opens a real mpv session there.
      # This is the step that catches a tarball whose `files` list forgot
      # something or whose dylibs are present under names nothing loads.
      - name: Verify the prebuilt end to end
        run: pnpm run verify:prebuilt

      - name: Pack the platform package
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tarballs"
          cd "platform-packages/empv-darwin-${{ matrix.arch }}"
          npm pack --pack-destination "${RUNNER_TEMP}/tarballs"
          ls -l "${RUNNER_TEMP}/tarballs"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tarball-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Windows: addon only. There is no runtime to build, and no dlopen check to
  # run here either -- the package deliberately ships without libmpv-2.dll, so
  # loading it would be testing a DLL this release does not distribute. The
  # native compile gate already drives a real session against the pinned runtime
  # on every push.
  # ───────────────────────────────────────────────────────────────────────────
  # ───────────────────────────────────────────────────────────────────────────
  # The Windows libmpv, cross-compiled with MinGW-w64 on a Linux runner. It runs
  # here rather than on windows-latest because mpv has no MSVC build and MinGW
  # cross-compilation is what its own Windows builds have always used -- and
  # because a Linux runner is several times cheaper in wall-clock for a
  # seven-package source build.
  #
  # The MSVC-built addon links the result through an import library synthesised
  # from the DLL's exports, which is the same mechanism the compile gate already
  # uses against the pinned upstream DLL.
  # ───────────────────────────────────────────────────────────────────────────
  windows-runtime:
    name: windows runtime (mingw cross)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: decide
    if: needs.decide.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # apt's meson trails what mpv and libplacebo require often enough that
      # pinning to the distribution version is a recurring failure; pipx tracks
      # upstream.
      - name: Install the cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64 ninja-build nasm pkg-config cmake
          pipx install meson
          x86_64-w64-mingw32-gcc --version | head -1
          meson --version
          cmake --version | head -1

      - name: Setup pnpm (from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Cache the built LGPL runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: windows-runtime-prefix
          key: >-
            empv-lgpl-runtime-win32-x64-${{ hashFiles(
              'scripts/embedded-mpv/runtime-pins.mjs',
              'scripts/embedded-mpv/build-windows-runtime.mjs',
              'scripts/embedded-mpv/patches/**'
            ) }}

      - name: Cross-compile the LGPL libmpv from pinned sources
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: pnpm run build-runtime:windows -- x64 "${GITHUB_WORKSPACE}/windows-runtime-prefix"

      # Only the header, the one DLL and the manifest cross to the Windows job.
      # The rest of the prefix is a few hundred megabytes of static archives that
      # were link inputs and are of no use downstream.
      #
      # The DLL is named from the manifest rather than globbed. bin/ also holds
      # whatever the dependency builds happened to install there -- shaderc puts
      # libshaderc_shared.dll and libSPIRV-Tools-shared.dll in it, neither of
      # which anything links -- and a glob carried all three through staging and
      # into the package before the licence assertion caught it. What ships is one
      # DLL by design, so this copies exactly the one the build says it produced.
      - name: Collect what the Windows build needs
        run: |
          set -euo pipefail
          prefix="${GITHUB_WORKSPACE}/windows-runtime-prefix"
          out="${RUNNER_TEMP}/libmpv-lgpl"
          library="$(node -p "require('${prefix}/runtime-manifest.json').library")"
          mkdir -p "${out}/bin"
          cp -R "${prefix}/include" "${out}/include"
          cp "${prefix}/bin/${library}" "${out}/bin/${library}"
          cp "${prefix}/runtime-manifest.json" "${out}/"
          ls -l "${out}/bin"
          du -sh "${out}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-lgpl-runtime
          path: ${{ runner.temp }}/libmpv-lgpl
          if-no-files-found: error

  windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [decide, windows-runtime]
    if: needs.decide.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    # pwsh, matching the compile gate. Under Git Bash the MSVC toolchain is not
    # what gets used: /usr/bin/link -- GNU coreutils' link(1) -- comes first on
    # PATH and shadows link.exe, and rustc's own build scripts fail to link with
    # "extra operand" long before anything of this package is compiled.
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          key: release-win32

      # dumpbin.exe and lib.exe, which turn the DLL's export table into an
      # import library, and link.exe for the addon itself.
      - name: Setup MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup pnpm (from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download the cross-built LGPL runtime
        uses: actions/download-artifact@v4
        with:
          name: windows-lgpl-runtime
          path: ${{ runner.temp }}/libmpv-lgpl

      # MinGW's linker emits a .dll.a that link.exe will not read, so the import
      # library is synthesised here from the DLL's own exports. Staging then puts
      # the runtime where build:native looks for a vendored one, which is the
      # same path macOS takes.
      - name: Stage the runtime for the addon build
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'libmpv-lgpl'
          $dll = Join-Path $prefix 'bin\libmpv-2.dll'
          if (-not (Test-Path $dll)) { throw "missing $dll" }

          node scripts/embedded-mpv/msvc-import-lib.mjs $dll (Join-Path $prefix 'lib')
          if ($LASTEXITCODE -ne 0) { throw "import library generation exited $LASTEXITCODE" }

          pnpm run stage-runtime -- win32 x64 $prefix
          if ($LASTEXITCODE -ne 0) { throw "stage-runtime exited $LASTEXITCODE" }

      - name: Build the addon against the staged runtime
        env:
          EMPV_REQUIRE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm run build:native
          if ($LASTEXITCODE -ne 0) { throw "build:native exited $LASTEXITCODE" }

      - name: Assert the addon carries the release runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content dist/native/runtime-manifest.json | ConvertFrom-Json
          if ($manifest.origin -ne 'vendored-lgpl') {
            throw "Refusing to release a `"$($manifest.origin)`" runtime."
          }
          if ($manifest.arch -ne 'x64') { throw "Staged runtime is $($manifest.arch), not x64." }
          Write-Host "origin=$($manifest.origin) arch=$($manifest.arch)"

      - name: Pack the platform package
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm run pack:platform -- win32 x64
          if ($LASTEXITCODE -ne 0) { throw "pack:platform exited $LASTEXITCODE" }

          $tarballs = Join-Path $env:RUNNER_TEMP 'tarballs'
          New-Item -ItemType Directory -Force -Path $tarballs | Out-Null
          Push-Location 'platform-packages/empv-win32-x64'
          npm pack --pack-destination $tarballs
          if ($LASTEXITCODE -ne 0) { throw "npm pack exited $LASTEXITCODE" }
          Pop-Location
          Get-ChildItem $tarballs

      # The package now carries a libmpv, so what has to be asserted is that it
      # is the one built here. A GPL DLL arriving by any other route would
      # relicense everything that installs this.
      - name: Assert the bundled libmpv is the LGPL one
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'platform-packages/empv-win32-x64'
          $dlls = @(Get-ChildItem -Path $package -Filter *.dll)
          if ($dlls.Count -ne 1 -or $dlls[0].Name -ne 'libmpv-2.dll') {
            throw "Expected exactly libmpv-2.dll, found: $($dlls.Name -join ', ')"
          }
          $manifest = Get-Content (Join-Path $package 'runtime-manifest.json') | ConvertFrom-Json
          if ($manifest.origin -ne 'vendored-lgpl') {
            throw "Bundled runtime origin is $($manifest.origin), not vendored-lgpl."
          }
          Write-Host "bundled $($dlls[0].Name) ($([math]::Round($dlls[0].Length / 1MB, 1)) MB), origin=$($manifest.origin)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tarball-win32-x64
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Publish. Runs only for a tag, and only once every platform has produced its
  # tarball -- a release missing a platform is worse than a late one, because
  # installs on that platform fail with a resolver error rather than an
  # unavailable download.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: release
    needs: [decide, main-package, macos, windows-runtime, windows]
    if: needs.decide.outputs.should_release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download every tarball
        uses: actions/download-artifact@v4
        with:
          path: tarballs
          pattern: tarball-*
          merge-multiple: true

      - name: Checksum
        run: |
          set -euo pipefail
          cd tarballs
          ls -l
          sha256sum ./*.tgz | sed 's|\./||' > SHASUMS256.txt
          cat SHASUMS256.txt

      # empv is not on npm, so the optionalDependency cannot resolve: the
      # platform package has to be named on the command line alongside the main
      # one. Saying so here is the difference between a release that installs
      # and one that installs without an addon and fails at first use.
      - name: Write the release notes
        env:
          TAG: v${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          version="${TAG#v}"
          cat > notes.md <<EOF
          ## Install

          empv is not published to npm yet, so the platform package cannot be
          resolved as an optional dependency and has to be installed alongside
          the main one:

          \`\`\`sh
          # macOS, Apple Silicon
          npm install ${base}/empv-${version}.tgz ${base}/empv-darwin-arm64-${version}.tgz

          # macOS, Intel
          npm install ${base}/empv-${version}.tgz ${base}/empv-darwin-x64-${version}.tgz

          # Windows
          npm install ${base}/empv-${version}.tgz ${base}/empv-win32-x64-${version}.tgz
          \`\`\`

          No Rust toolchain is needed: the addon in each platform package is prebuilt.

          ## What is in each package

          Every package carries \`empv.node\` and the libmpv it loads, built from
          pinned sources with \`-Dgpl=false\` and no \`--enable-gpl\` FFmpeg.
          Those libraries are LGPL-2.1-or-later; \`THIRD-PARTY-NOTICES.md\` lists
          their versions and sources and \`runtime-manifest.json\` records the
          exact build inputs. Nothing needs installing alongside them.

          On Windows that libmpv had to be built rather than fetched: every
          prebuilt Windows libmpv is GPL. It is cross-compiled with MinGW-w64
          and every dependency is linked into the one DLL, which imports nothing
          but Windows itself.

          There is no Linux package. It would be addon-only too, but the runtime
          resolver only looks for libmpv inside the runtime directory, and on
          Linux it lives in \`/usr/lib\`.

          empv itself is Apache-2.0.
          EOF
          cat notes.md

      # --target creates the tag at the commit that was built, so the tag is a
      # record of what shipped rather than something that had to exist first.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file notes.md \
            tarballs/*.tgz tarballs/SHASUMS256.txt
