[package]
name = "empv"
version = "0.1.0"
edition = "2024"
description = "Embedded libmpv session, playback and presentation core behind the empv N-API addon."
authors = ["Linmi"]
license = "Apache-2.0"
repository = "https://github.com/linmi/empv"
# The crate is a cdylib consumed through N-API by the `empv` npm package, not a
# Rust library anyone depends on from crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.10.3", features = ["napi9", "async", "serde-json"] }
napi-derive = "3.5.9"

[build-dependencies]
napi-build = "2"
cc = "1"

[profile.release]
lto = true
strip = "symbols"
