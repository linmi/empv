[package]
name = "empv_presenter"
version = "0.1.0"
edition = "2024"
description = "macOS-only presenter bridge for empv; deliberately contains no libmpv runtime."
authors = ["Linmi"]
license = "Apache-2.0"
repository = "https://github.com/linmi/empv"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.10.3", features = ["napi9"] }
napi-derive = "=3.5.9"

[build-dependencies]
napi-build = "=2.3.2"
cc = "1"

[profile.release]
lto = true
strip = "symbols"
